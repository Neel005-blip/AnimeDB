<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - OtakuVault</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="align-items: center; justify-content: center;">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-icon" style="margin: 0 auto; width: 48px; height: 48px; font-size: 1.5rem;">⚡</div>
        <h1>Create Account</h1>
        <p>Join OtakuVault to track your anime & manga</p>
      </div>

      {% if error %}
      <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
        <span>✕</span> <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="POST" action="/signup" style="display: flex; flex-direction: column; gap: 16px;">
        <div class="form-group">
          <label for="username">Choose a Username</label>
          <input type="text" id="username" name="username" placeholder="e.g. AnimeFan99" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Choose a Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-top: 8px; padding: 12px;">
          Create Free Account ➔
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-muted);">
        Already have an account? 
        <a href="{{ url_for('login') }}" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign In</a>
      </div>
    </div>
  </div>

</body>
</html>
